<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Map</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <div id="menu">
        <button type="button" id="menu-btn">☰ Menu</button>
        <div id="menu-dropdown" class="hidden">
            <button type="button" data-action="souvenirs">📍 Mes souvenirs</button>
            <button type="button" data-action="parametres">⚙️ Paramètres</button>
        </div>
    </div>

    <aside id="panel" class="hidden">
        <h2 id="panel-title"></h2>
        <button type="button" id="panel-close">✕</button>
        <div id="panel-content"></div>
    </aside>

    <div id="form-souvenir" class="hidden">
        <form id="memory-form">
            <h2>Nouveau souvenir</h2>
            <input type="text" id="title" placeholder="Titre" required maxlength="255">
            <textarea id="description" placeholder="Description (optionnel)"></textarea>
            <input type="file" id="files" accept="image/*,video/*" multiple>
            <div id="preview"></div>
            <button type="button" id="cancel-btn">Annuler</button>
            <button type="submit">Enregistrer</button>
        </form>
    </div>

    <div id="modal-overlay" class="hidden">
        <section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div id="story-progress" aria-hidden="true"></div>
            <div id="story-stage">
                <time id="story-date"></time>
                <div id="modal-files"></div>
                <button type="button" id="story-prev" class="story-nav" aria-label="Média précédent">‹</button>
                <button type="button" id="story-next" class="story-nav" aria-label="Média suivant">›</button>
                <div id="story-caption">
                    <h2 id="modal-title"></h2>
                    <p id="modal-description"></p>
                </div>
                <button type="button" id="modal-close" aria-label="Fermer">✕</button>
            </div>
        </section>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js?v=4"></script>
    
</body>
</html>
