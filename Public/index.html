<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Map</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <div id="menu">
        <button type="button" id="menu-btn">☰ Menu</button>
        <div id="menu-dropdown" class="hidden">
            <button type="button" data-action="souvenirs">📍 Mes souvenirs</button>
            <button type="button" data-action="parametres">⚙️ Paramètres</button>
        </div>
    </div>

    <aside id="panel" class="hidden">
        <h2 id="panel-title"></h2>
        <button type="button" id="panel-close">✕</button>
        <div id="panel-content"></div>
    </aside>

    <div id="form-overlay" class="hidden">
        <form id="memory-form">
            <h2>Nouveau souvenir</h2>
            <input type="text" id="title" placeholder="Titre" required maxlength="255">
            <textarea id="description" placeholder="Description (optionnel)"></textarea>
            <input type="file" id="files" accept="image/*,video/*" multiple>
            <div id="preview"></div>
            <button type="button" id="cancel-btn">Annuler</button>
            <button type="submit">Enregistrer</button>
        </form>
    </div>

    <div id="modal-overlay" class="hidden">
        <div id="modal">
            <button type="button" id="modal-close">✕</button>
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            <div id="modal-files"></div>
        </div>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
