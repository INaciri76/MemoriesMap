<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
</head>

<body>
    <div id="map" style="width: 100%; height: 100vh;"></div>
    <div id="menu">
        <button type="button" id="menu-btn" aria-controls="menu-dropdown">
            <img class="menu-mark" src="assets/memories-map-globe.svg" alt="">
            <span class="menu-brand">
                <span class="menu-name">Memories Map</span>
            </span>
            <span class="menu-toggle" aria-hidden="true">☰</span>
        </button>
        <div id="menu-dropdown" class="hidden">
            <button type="button" data-action="souvenirs">Mes souvenirs</button>
            <button type="button" data-action="parametres">Paramètres</button>
        </div>
    </div>

    <aside id="panel" class="hidden">
        <h2 id="panel-title"></h2>
        <button type="button" id="panel-close">✕</button>
        <div id="panel-content"></div>
    </aside>

    <div id="form-souvenir" class="hidden">
        <form id="memory-form">
            <div class="form-heading">
                <span class="form-eyebrow">VOTRE MOMENT</span>
                <h2>Nouveau souvenir</h2>
            </div>
            <div class="form-field">
                <label for="title">Titre</label>
                <input type="text" id="title" placeholder="Donnez un titre à ce moment" required maxlength="255">
            </div>
            <div class="form-field">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Quelques mots pour vous en souvenir"></textarea>
            </div>
            <div class="form-field">
                <label for="files">Photos et vidéos</label>
                <input type="file" id="files" accept="image/*,video/*" multiple>
                <label class="file-picker" for="files">
                    <span>Ajouter des photos/vidéos</span>
                    <span class="file-picker-mark" aria-hidden="true">+</span>
                </label>
            </div>
            <div id="preview"></div>
            <div class="form-actions">
                <button type="button" id="cancel-btn">Annuler</button>
                <button type="submit">Enregistrer</button>
            </div>
        </form>
    </div>

    <div id="modal-overlay" class="hidden">
        <section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div id="story-progress" aria-hidden="true"></div>
            <div id="story-stage">
                <time id="story-date"></time>
                <div id="modal-files"></div>
                <button type="button" id="story-prev" class="story-nav" aria-label="Média précédent">‹</button>
                <button type="button" id="story-next" class="story-nav" aria-label="Média suivant">›</button>
                <input type="file" id="story-add-files" class="hidden" accept="image/*,video/*" multiple>
                <div id="story-caption">
                    <h2 id="modal-title"></h2>
                    <p id="modal-description"></p>
                </div>
                <button type="button" id="story-delete" class="story-delete" aria-label="Supprimer ce souvenir" title="Supprimer ce souvenir">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
                </button>
                <button type="button" id="story-add" class="story-add" aria-label="Ajouter des médias à cette story" title="Ajouter des médias">+</button>
                <button type="button" id="modal-close" aria-label="Fermer">✕</button>
            </div>
        </section>
    </div>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js?v=7"></script>

</body>

</html>
